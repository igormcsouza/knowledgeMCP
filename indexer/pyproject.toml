[project]
name = "knowledge-indexer"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.34.144",
    "PyGithub==2.3.0",
    "PyYAML==6.0.1",
    "langchain-text-splitters==0.2.2",
    "langchain-aws==0.1.11",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.9",
    "moto[dynamodb]==5.0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
