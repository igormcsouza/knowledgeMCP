[project]
name = "knowledge-mcp-server"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.34.144",
    "mangum==0.17.0",
    "mcp[cli]>=1.9.0,<2",
    "starlette==0.41.3",
    "PyGithub==2.3.0",
    "langgraph==0.2.34",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "ruff==0.11.9",
    "moto[dynamodb]==5.0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
